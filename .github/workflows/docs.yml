name: docs

# Builds the MkDocs site and deploys it to GitHub Pages. The org Pages site
# (qmilab.github.io) uses the apex domain qmilab.com, so this project site is
# served at qmilab.com/asterism/ — and building into _site/docs lands the docs
# at qmilab.com/asterism/docs/. Do NOT set a custom domain (CNAME) on this
# repo's Pages, or it would override the inherited apex.
#
# This repo's Pages owns the whole /asterism/* path (a project site takes
# precedence over the org site for its prefix), so the landing page at
# /asterism/ must also ship from here: landing/. is copied into the artifact
# root (_site/) alongside _site/docs/.
#
# One-time setup: repo Settings -> Pages -> Source = "GitHub Actions".

on:
  push:
    branches: [main]
    # Every INPUT to the build below, not just the content. `requirements-docs.txt` pins
    # the renderer, so a commit that only bumps that pin changes what the site is built
    # with — and its own documented upgrade path is exactly that commit. Omit it and the
    # bump merges to `main` without deploying, leaving the published site on the old
    # renderer until some unrelated docs change happens along.
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'landing/**'
      - 'requirements-docs.txt'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      # Pinned in requirements-docs.txt, shared with the PR gate in ci.yml so the build
      # that is gated and the build that is deployed are the same build.
      - run: pip install -r requirements-docs.txt
      # `--strict` turns MkDocs' warnings — an unresolvable internal link, a nav entry
      # pointing at a page that does not exist — into a failed build. Without it those
      # deploy silently, and the first person to find them is a reader.
      - run: mkdocs build --strict --site-dir _site/docs
      # Land the landing page at the /asterism/ root, next to /asterism/docs/.
      # README.md is a maintainer note, not a published asset — drop it.
      - run: |
          cp -r landing/. _site/
          rm -f _site/README.md
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
