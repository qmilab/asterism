name: ci

# Gates every pull request on what a release is already gated on, plus the checks that
# only ran locally before: the full test suite, both runtime floors, and a guard against
# committed database artifacts.
#
# Why this exists: until now the only check on a PR was the container image build
# (docker.yml), which compiles the workspace but never runs `bun test` — that ran solely
# on a release tag (release.yml). So a red suite could reach `main` and only be caught at
# publish time, and every "CI green" on a PR meant "it compiles", not "it passes".
#
# Cheap checks first, so an obvious problem fails in seconds rather than after the suite.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same branch supersedes an in-flight run; `main` is never cancelled.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      # Report both legs. A failure on the floor and a failure on the newest LTS are
      # different problems, and cancelling one to report the other hides which.
      fail-fast: false
      matrix:
        # The FLOOR ITSELF and the current Active LTS. `22.19` is pinned rather than
        # `22`, which would resolve to the newest 22.x and never exercise the boundary the
        # manifests actually claim — the floor is 22.19.0 because `@earendil-works/pi-*`
        # requires it. Testing only one version would make the `+` a claim about nothing.
        # Raise both when the floor moves; see CLAUDE.md, "the floor is a policy".
        node: ['22.19', '24']
    name: test (node ${{ matrix.node }})
    steps:
      - uses: actions/checkout@v5

      # No dependencies needed, and it reads only the first bytes of each tracked file,
      # so it is the fastest thing here — run it before anything is installed.
      - name: No committed database artifacts
        run: node scripts/no-db-artifacts.mjs

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Node is the compatibility floor the kernel is written against, and `verify:node`
      # exercises it: `22.19` is the exact floor the published CLI declares, and `24` is the
      # Active LTS most developers actually have.
      #
      # THIS STEP MUST STAY BEFORE `bun install`. `better-sqlite3` is a NAN/V8 addon, not
      # Node-API, so its binary is ABI-specific (`_node_register_module_v<abi>`); its install
      # script is `prebuild-install || node-gyp rebuild`, and `prebuild-install` resolves the
      # ABI from the Node that EXECUTES it — the one on PATH. Setting up Node first is
      # therefore what makes each matrix leg fetch the addon its own runtime can load. Move
      # this after the install and the floor leg fetches Bun's ABI instead, then fails in
      # `verify:node` with a NODE_MODULE_VERSION mismatch that looks nothing like its cause.
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - run: bun install --frozen-lockfile

      # Assert the invariant the step order above exists to hold, rather than discovering it
      # broke three steps later. Loading the addon under the matrix Node is the whole test:
      # a wrong-ABI binary throws here, named, instead of surfacing inside `verify:node`.
      - name: Native addon loads under this Node
        run: |
          node -e '
            const { createRequire } = require("node:module");
            const req = createRequire(process.cwd() + "/packages/core/package.json");
            req("better-sqlite3");
            console.log(`better-sqlite3 loaded under Node ${process.version} (ABI ${process.versions.modules})`);
          '

      # Compilation, then the suite. `bun run build` is `tsc -b` across the workspace's
      # project references, so a type error fails here rather than inside a test run.
      - run: bun run build
      - run: bun test

      # Both non-Bun runtimes. These re-run `tsc -b` (a no-op after the build above) and
      # then drive the acceptance script under Node and Deno, which is what keeps
      # "Bun-first, Node-floor" from quietly becoming Bun-only.
      - run: bun run verify:node
      - run: bun run verify:deno

      # Every command the docs advertise, typed at the shipped binary; every internal link
      # in `docs/` and the repo-root markdown, headings included; and the command
      # reference's claim to document EVERY command. The self-test runs first and plants
      # known-bad commands AND known-bad links, so a green docs check means the checker can
      # still tell a broken page from a working one rather than passing vacuously.
      - run: bun run check:docs:self-test
      - run: bun run check:docs

      # The threat model claims "this invariant is proven by that test" ~40 times. Each is a
      # citation that goes stale silently the first time a test is renamed — and a dead
      # citation in a security document reads as fabrication, not as a formatting nit. This
      # resolves every one against the tests that actually RAN AND PASSED, read from the
      # runner's own report rather than grepped out of source. Self-test first, same reason
      # as the docs check: it plants a renamed, a misfiled, a paraphrased, a skipped and a
      # failed citation, so a green run cannot be vacuous.
      - run: bun run check:safety-case:self-test
      - run: bun run check:safety-case

  # The docs SITE, built exactly as Pages builds it.
  #
  # Why this is a PR gate and not only a deploy step: docs.yml runs on push to `main`, so
  # until now a page that broke the site build reached `main` first and was discovered by
  # the deploy — the same "caught at publish time" gap this workflow was created to close
  # for the test suite.
  #
  # This does NOT duplicate `check:docs`. That check types the commands the pages advertise
  # at the real binary and never builds the site; and where the two do overlap, on internal
  # links, they still see different things — but not the way this comment used to say. It
  # claimed `check:docs` was the weaker of the two on links because its matcher was
  # lower-case only. That matcher is gone: `check:docs` now resolves every internal link on
  # disk, README and the root markdown included, and fails on a missing `#fragment`.
  #
  # What each one alone would miss, both measured by planting one:
  #   `--strict`     never reads README (`docs_dir: docs`), so README's ~56 internal links
  #                  are invisible to it; and it logs a MISSING ANCHOR at INFO, so a dead
  #                  `#fragment` does not fail the build at all.
  #   `check:docs`   resolves against the FILESYSTEM, not the site, so it cannot know that
  #                  a `docs/` page linking to a repo file outside `docs/` resolves here and
  #                  404s once published. `--strict` knows what is in the site and catches it.
  # Neither check subsumes the other; run both.
  #
  # Separate job because it shares nothing with the test matrix — no Bun, no Node, no
  # native addon — so it runs in parallel instead of adding a minute to both legs.
  docs-site:
    runs-on: ubuntu-latest
    name: docs site
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          # Left floating deliberately: the renderer is what decides the output and it is
          # pinned (requirements-docs.txt); the interpreter minor is not worth a second
          # pin to keep current.
          python-version: '3.x'
      - run: pip install -r requirements-docs.txt
      # Same command docs.yml deploys with, `--strict` included, so a page that would fail
      # the deploy fails here instead — while it is still a pull request.
      - run: mkdocs build --strict --site-dir _site/docs
